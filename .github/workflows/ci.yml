name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-debian:
    name: Check & Test (Debian Trixie)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check and run tests in Debian Trixie
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -e CARGO_TARGET_DIR=/tmp/target \
            -w /work \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config \
                libgtk-4-dev libgtk4-layer-shell-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo check --all-targets --locked
              cargo test --locked
            '

  check-fedora-rpm:
    name: Build & Test RPM Spec (Fedora)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build RPM from packaging/safeeyes-rs.spec
        run: |
          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' packaging/safeeyes-rs.spec | head -n1 | tr -d '[:space:]')
          git archive --format=tar.gz --prefix="safeeyes-rs-${VERSION}/" -o "/tmp/safeeyes-rs-${VERSION}.tar.gz" HEAD
          docker run --rm \
            -v "$PWD:/work:ro" \
            -v "/tmp/safeeyes-rs-${VERSION}.tar.gz:/root/rpmbuild/SOURCES/safeeyes-rs-${VERSION}.tar.gz:ro" \
            -w /work \
            fedora:latest \
            bash -euo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False \
                rpm-build cargo rust gtk4-devel gtk4-layer-shell-devel
              rpmbuild -bb packaging/safeeyes-rs.spec
            '
