name: Flatpak Build Check

on:
  push:
    branches: [main]
    paths:
      - 'packaging/flathub/**'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flathub/**'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  flatpak-build:
    name: Build Flatpak & Upload Bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate packaging/flathub/io.github.zfgf11.safeeyes_rs.desktop
          appstreamcli validate --pedantic --no-net packaging/flathub/io.github.zfgf11.safeeyes_rs.metainfo.xml

      - name: Build Flatpak bundle in privileged Fedora container
        run: |
          mkdir -p dist
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("packaging/flathub/io.github.zfgf11.safeeyes_rs.yml")
          text = p.read_text()
          idx = text.index("      - type: archive\n        url: https://github.com/zfgf11/safeeyes-rs/")
          end = text.index("      - cargo-sources.json")
          ci_text = text[:idx] + "      - type: dir\n        path: ../..\n" + text[end:]
          pathlib.Path("packaging/flathub/ci-manifest.yml").write_text(ci_text)
          EOF

          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -w /work \
            fedora:latest \
            bash -euo pipefail -c '
              dnf install -y --setopt=install_weak_deps=False flatpak flatpak-builder
              flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
              flatpak install -y --noninteractive flathub \
                org.gnome.Platform//51 \
                org.gnome.Sdk//51 \
                org.freedesktop.Sdk.Extension.rust-stable//26.08
              flatpak-builder \
                --force-clean \
                --disable-rofiles-fuse \
                --sandbox \
                --repo=/tmp/flatpak-repo \
                /tmp/flatpak-build \
                packaging/flathub/ci-manifest.yml
              flatpak build-bundle \
                --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
                /tmp/flatpak-repo \
                /work/dist/safeeyes-rs.flatpak \
                io.github.zfgf11.safeeyes_rs
              chown -R "${HOST_UID}:${HOST_GID}" /work/dist
            '

      - uses: actions/upload-artifact@v4
        with:
          name: safeeyes-rs-flatpak-bundle
          path: dist/safeeyes-rs.flatpak
