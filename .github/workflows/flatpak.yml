name: Flatpak Build Check

on:
  push:
    branches: [main]
    paths:
      - 'packaging/flathub/**'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/flathub/**'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

jobs:
  validate-metadata:
    name: Validate Desktop & AppStream Metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate packaging/flathub/io.github.zfgf11.safeeyes_rs.desktop
          appstreamcli validate --pedantic --no-net packaging/flathub/io.github.zfgf11.safeeyes_rs.metainfo.xml

  flatpak-build:
    name: Build Flatpak Bundle
    needs: validate-metadata
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install rust-stable SDK extension into user store
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Prepare local-source Flatpak manifest for CI
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("packaging/flathub/io.github.zfgf11.safeeyes_rs.yml")
          text = p.read_text()
          idx = text.index("      - type: archive\n        url: https://github.com/zfgf11/safeeyes-rs/")
          end = text.index("      - cargo-sources.json")
          ci_text = text[:idx] + "      - type: dir\n        path: ../..\n" + text[end:]
          pathlib.Path("packaging/flathub/ci-manifest.yml").write_text(ci_text)
          EOF

      - name: Build Flatpak bundle
        run: |
          mkdir -p dist
          flatpak-builder \
            --force-clean \
            --disable-rofiles-fuse \
            --sandbox \
            --repo=repo \
            flatpak_app \
            packaging/flathub/ci-manifest.yml
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo \
            dist/safeeyes-rs.flatpak \
            io.github.zfgf11.safeeyes_rs

      - uses: actions/upload-artifact@v4
        with:
          name: safeeyes-rs-flatpak-bundle
          path: dist/safeeyes-rs.flatpak
