[package]
name = "safeeyes-rs"
version = "0.1.2"
edition = "2024"
description = "Lightweight, native Wayland Rust rewrite of SafeEyes for KDE Plasma and GNOME"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = "5"
notify-rust = "4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
