[package]
name = "safeeyes-rs"
version = "0.1.5"
edition = "2024"
description = "Lightweight, native Wayland Rust rewrite of SafeEyes for KDE Plasma and GNOME"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = "5"
notify-rust = "4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "zfgf11 <zfgf11@users.noreply.github.com>"
copyright = "2026, zfgf11"
license-file = ["LICENSE", "0"]
extended-description = """
A lightweight, ultra-low-resource Rust rewrite of SafeEyes for Linux
(KDE Plasma and GNOME on Wayland), featuring a native StatusNotifierItem
system tray, responsive fullscreen break overlay, and event-driven idle
and screen-lock integration."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/safeeyes-rs", "usr/bin/", "755"],
    ["packaging/safeeyes-rs.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/safeeyes-rs/README.md", "644"],
]
